plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gpsmhn'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gpsmhn'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // OCR đọc chỉ số trên màn hình game (MLKit Latin, không cần token/khoá riêng).
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
